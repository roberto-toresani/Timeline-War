<!DOCTYPE html>
<html lang="en">
<!-- PAGINA DI LAVORO (non fa parte del gioco): banco di prova headless.
     Carica il motore VERO (gli stessi script di index.html), applica la mappa
     iniziale, avvia una partita a TUTTI-BOT con RNG seminato e la fa girare in
     modo SINCRONO a chunk (window.SIM), raccogliendo la telemetria di ogni
     decennio per ogni regno. Non tocca la logica di gioco: usa Bot.turnScript
     (l'unico hook diagnostico) e GameActions.endTurn come il driver normale. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risiko — banco di prova headless</title>
    <link rel="stylesheet" href="css/tokens.css?v=72">
    <link rel="stylesheet" href="css/style.css?v=72">
</head>
<body>
    <div id="app-container">
        <div id="game-board">
            <div id="map-wrapper"><div id="svg-container">Loading Map...</div></div>
            <div id="side-panel">
                <div id="info-panel"><h2 id="province-name">-</h2>
                    <div id="province-details"><span id="p-name"></span><span id="p-owner"></span><span id="p-resource"></span></div>
                </div>
                <div id="palette"></div>
                <div id="player-tabs-list"></div>
                <div id="player-tab-content"></div>
                <div id="resource-palette"></div>
                <div id="piece-palette"></div>
                <div id="game-reinforce-board"></div>
                <div id="decree-player"></div>
                <datalist id="decree-provinces"></datalist>
                <select id="decree-res"></select>
            </div>
        </div>
    </div>

    <!-- Firebase (resta in modalità locale coi placeholder) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/sync.js"></script>

    <script src="data/map_data.js?v=72"></script>
    <script src="data/id_mapping.js?v=72"></script>
    <script src="data/embedded_map.js?v=72"></script>
    <script src="data/resource_icons.js?v=72"></script>
    <script src="data/piece_icons.js?v=72"></script>
    <script src="data/default_state.js?v=72"></script>
    <script src="data/city_names.js?v=72"></script>
    <script src="data/historic_battles.js?v=72"></script>
    <script src="data/start_religions.js?v=72"></script>
    <script src="data/province_terrain.js?v=72"></script>
    <script src="js/chronicle.js?v=72"></script>
    <script src="js/religions.js?v=72"></script>
    <script src="js/terrain.js?v=72"></script>
    <script src="js/map-decor.js?v=72"></script>
    <script src="js/battle.js?v=72"></script>
    <script src="js/kingdom-stats.js?v=72"></script>
    <script src="js/popularity.js?v=72"></script>
    <script src="js/game-rules.js?v=72"></script>
    <script src="js/map-anchors.js?v=72"></script>
    <script src="js/sea-routes.js?v=72"></script>
    <script src="js/spies.js?v=72"></script>
    <script src="js/diplomacy.js?v=72"></script>
    <script src="js/doctrines.js?v=72"></script>
    <script src="js/objectives.js?v=72"></script>
    <script src="js/events.js?v=72"></script>
    <script src="js/chronicles.js?v=72"></script>
    <script src="js/app.js?v=72"></script>
    <script src="js/game-actions.js?v=72"></script>
    <script src="js/bot.js?v=72"></script>
    <script src="js/setup.js?v=72"></script>
    <script src="js/start-map.js?v=72"></script>

    <script>
    (function () {
        const R = () => window.Risiko;
        const GA = () => window.GameActions;
        const GR = () => window.GameRules;

        // --- RNG seminato (mulberry32): rende la partita riproducibile ---
        function mulberry32(seed) {
            let a = seed >>> 0;
            return function () {
                a |= 0; a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        const SIM = window.SIM = {
            ready: false, started: false, done: false,
            seed: null, data: [], log: [], firsts: {}, error: null,
            lastTurn: 0, safety: 0
        };

        function pronto() {
            return R() && R().mapReady && R().mapReady() && R().neighborsReady &&
                R().neighborsReady() && window.GameSetup && window.StartMap &&
                window.Bot && window.Bot.turnScript && window.SeaRoutes;
        }

        // --- telemetria di un regno in un dato decennio ---
        function far(path) {
            try {
                const c = R().engine.provinceCenter(path);
                return c && GR().isFarProvince(c.x, c.y);
            } catch (e) { return false; }
        }
        function snapPlayer(p) {
            const paths = R().ownedPaths(p.name);
            const ids = paths.map(x => x.id);
            let farN = 0, citta = 0, fort = 0, vascelli = 0, barche = 0, mercati = 0, soldati = 0;
            paths.forEach(x => {
                if (far(x)) farN++;
                citta += R().countPiece(x, 'citta');
                fort += R().countPiece(x, 'fortezza');
                soldati += R().countPiece(x, 'soldato');
            });
            let ctx = null;
            try { ctx = R().objectiveContext(p); } catch (e) { ctx = null; }
            if (ctx) {
                try { vascelli = ctx.shipCountOf('vascello'); } catch (e) {}
                try { barche = ctx.shipCountOf('barca'); } catch (e) {}
                try { mercati = ctx.hasMercato() ? 1 : 0; } catch (e) {}
            }
            let fede = null; try { fede = R().stateReligionOf(p); } catch (e) {}
            let cap = null; try { const cp = R().getCapitalPathFor(p.name); cap = cp ? cp.id : null; } catch (e) {}
            let obj = null;
            try {
                const ev = R().objectivesFor(p);
                if (ev) obj = {
                    ciclo: ev.ciclo, capitolo: ev.capitolo, intensita: ev.intensita,
                    epoca: ev.epoca, tema: ev.tema, punti: ev.punti, puntiMax: ev.puntiMax,
                    items: ev.items.map(it => ({
                        tier: it.tier, tipo: it.tipo, check: it.check, titolo: it.titolo,
                        soglia: it.soglia, misura: it.misura, completato: it.completato,
                        // La regione dell'obiettivo, se ne ha una (per capire se chiede
                        // terre irraggiungibili): quante ne possiede su quante ne chiede.
                        region: it.hint && it.hint.region ? {
                            size: (it.hint.region.size !== undefined ? it.hint.region.size
                                   : (it.hint.region.length || 0)),
                            owned: (function () {
                                const reg = it.hint.region;
                                const has = id => reg.has ? reg.has(id) : reg.indexOf(id) >= 0;
                                return ids.filter(has).length;
                            })()
                        } : null
                    }))
                };
            } catch (e) { obj = { err: String(e) }; }
            return {
                id: p.id, name: p.name, bot: p.bot || null,
                nato: p.nato || 1, prov: ids.length, far: farN,
                citta, fort, vascelli, barche, mercati, soldati,
                monete: p.monete || 0, capitale: cap, fede,
                prestigio: p.puntiPrestigio || 0,
                capitolo: p.capitolo || 0, intensita: p.intensita || null,
                rancore: (p.rancore || []).length, aggressioni: (p.aggressioni || []).length,
                patti: (p.patti || []).length,
                obj
            };
        }

        function recordFirsts(turn, sp) {
            const f = SIM.firsts;
            if (sp.vascelli > 0 && !f['vascello_' + sp.name])
                { f['vascello_' + sp.name] = turn; SIM.log.push('T' + turn + ' ' + sp.name + ' → primo Vascello'); }
            if (sp.far > 0 && !f['oltremare_' + sp.name])
                { f['oltremare_' + sp.name] = turn; SIM.log.push('T' + turn + ' ' + sp.name + ' → prima provincia in altro continente'); }
        }

        function snapshot() {
            const turn = R().turn();
            const players = R().players().map(snapPlayer);
            players.forEach(sp => recordFirsts(turn, sp));
            SIM.data.push({ turn, year: 1000 + (turn - 1) * 10, nKingdoms: players.length, players });
        }

        // --- un turno di un giocatore, in modo sincrono ---
        function onePlayerTurn() {
            const id = R().turnoDi();
            const p = R().players().find(x => x.id === id);
            if (!p) return false;
            if (p.bot) {
                try {
                    const it = window.Bot.turnScript(p);
                    let g = 0, step;
                    do { step = it.next(); } while (!step.done && ++g < 8000);
                } catch (e) { SIM.log.push('T' + R().turn() + ' turno di ' + p.name + ' interrotto: ' + e); }
            }
            try { GA().endTurn(); } catch (e) { SIM.error = 'endTurn: ' + e; return false; }
            return true;
        }

        // Corre verso `target` (max 100) con un budget di tempo di parete, così
        // ogni chiamata torna PULITA prima che il tool la uccida: niente chunk da
        // indovinare. Si richiama finché `done`.
        SIM.runTo = function (target, budgetMs) {
            if (!SIM.started || SIM.done) return SIM.status();
            const cap = Math.min(target || 100, 100);
            const t0 = performance.now();
            let guard = 0;
            while (R().turn() < cap && guard < 9000 &&
                   (performance.now() - t0) < (budgetMs || 15000)) {
                const cur = R().turn();
                if (!onePlayerTurn()) { SIM.done = true; break; }
                guard++;
                const nowT = R().turn();
                if (nowT !== cur) { snapshot(); SIM.lastTurn = nowT; }
            }
            if (R().turn() >= 100) SIM.done = true;
            SIM.safety += guard;
            return SIM.status();
        };

        SIM.status = function () {
            return {
                ready: SIM.ready, started: SIM.started, done: SIM.done,
                seed: SIM.seed, turn: R() ? R().turn() : 0,
                decades: SIM.data.length, playerTurns: SIM.safety,
                nKingdoms: R() ? R().players().length : 0,
                error: SIM.error, logTail: SIM.log.slice(-6)
            };
        };

        SIM.setup = function (seed) {
            if (!pronto()) return { ready: false };
            SIM.seed = seed;
            // Semina Math.random per l'intera partita: battaglie e scelte dei bot
            // diventano deterministiche a parità di seme.
            Math.random = mulberry32(seed);
            return window.StartMap.read().then(function (data) {
                const suMappa = !!(data && data.provinces && Object.keys(data.provinces).length);
                if (suMappa) R().scenario.apply(data);
                const res = window.GameSetup.newGame({ mantieniMappa: suMappa, rng: Math.random });
                // TUTTI bot: nessun umano. Assegna una strategia a ogni regno.
                window.Bot.assignStrategies(R().players(), new Set(), Math.random);
                SIM.ready = true; SIM.started = true;
                SIM.lastTurn = R().turn();
                snapshot();                             // decennio 1, stato di partenza
                return { ready: true, seed: seed, msg: res && res.msg,
                    kingdoms: R().players().map(p => ({ name: p.name, bot: p.bot })) };
            });
        };

        function waitReady(cb, n) {
            if (pronto()) { SIM.ready = true; cb(); return; }
            if ((n || 0) > 400) { SIM.error = 'motore non pronto'; return; }
            setTimeout(() => waitReady(cb, (n || 0) + 1), 150);
        }
        waitReady(function () { /* pronto: in attesa di SIM.setup(seed) dal driver */ });
    })();
    </script>
</body>
</html>
