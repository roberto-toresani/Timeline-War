<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Diagnostica ancoraggi</title>
<style>
  html,body{margin:0;background:#8fb3c9;font:12px/1.4 sans-serif;color:#222}
  #hud{position:fixed;top:0;left:0;right:0;background:rgba(20,16,11,.88);color:#f2e6cf;
       padding:6px 10px;z-index:9;font-family:monospace;white-space:pre}
  #map{padding-top:26px}
  svg{width:100vw;height:auto;display:block}
  path.state{fill:#e6d3a8;stroke:#a08b62;stroke-width:.15}
</style>
</head>
<body>
<div id="hud">calcolo…</div>
<div id="map"></div>
<script src="data/embedded_map.js"></script>
<script src="js/map-anchors.js"></script>
<script>
// Pagina di lavoro (non fa parte del gioco): disegna gli ancoraggi che
// map-anchors.js calcola per OGNI provincia, così si vede a colpo d'occhio
// dove finirebbero pedine e navi.
//   pallino VERDE  = ancora di terra dentro la provincia (giusto)
//   pallino ROSSO  = ancora di terra fuori dalla provincia (bug)
//   cerchio BLU    = ancora di mare in acqua (giusto), col raggio libero
//   cerchio ROSSO  = ancora di mare finita su terra (bug)
//   crocetta GRIGIA= centro del bounding box (il vecchio criterio), per confronto
// ?vb=x,y,w,h inquadra una zona;  ?only=Id1,Id2 limita alle province indicate.
const q = new URLSearchParams(location.search);
document.getElementById('map').innerHTML = RAW_SVG_CONTENT;
const svg = document.querySelector('svg');
if (q.get('vb')) svg.setAttribute('viewBox', q.get('vb').split(',').join(' '));
const only = q.get('only') ? q.get('only').split(',') : null;

const NS = 'http://www.w3.org/2000/svg';
const g = document.createElementNS(NS, 'g');
svg.appendChild(g);
const mk = (name, attrs) => {
  const e = document.createElementNS(NS, name);
  Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k]));
  g.appendChild(e); return e;
};

const paths = Array.from(svg.querySelectorAll('path.state')).filter(p => p.id)
  .filter(p => !only || only.indexOf(p.id) >= 0);

let badLand = [], badSea = [], noSea = [], coastal = 0;
const t0 = performance.now();
paths.forEach(p => {
  const bb = MapAnchors.mainBodyBBox(p);
  const a = MapAnchors.landAnchor(p);
  if (!bb || !a) return;
  const s = Math.max(0.6, Math.min(bb.w, bb.h) * 0.06);
  // centro del bounding box: il criterio vecchio, per confronto
  mk('path', { d: `M${bb.x + bb.w / 2 - s} ${bb.y + bb.h / 2}h${2 * s}M${bb.x + bb.w / 2} ${bb.y + bb.h / 2 - s}v${2 * s}`,
               stroke: '#555', 'stroke-width': s * 0.25, fill: 'none', opacity: .8 });
  const inside = MapAnchors.pointInPath(p, a.x, a.y);
  if (!inside) badLand.push(p.id);
  mk('circle', { cx: a.x, cy: a.y, r: s * 0.55, fill: inside ? '#1a9c3c' : '#e2001a',
                 stroke: '#000', 'stroke-width': s * 0.12 });
  mk('circle', { cx: a.x, cy: a.y, r: a.r, fill: 'none', stroke: inside ? '#1a9c3c' : '#e2001a',
                 'stroke-width': s * 0.1, opacity: .45 });

  if (!MapAnchors.isCoastal(p)) return;
  coastal++;
  const sea = MapAnchors.seaAnchor(p);
  if (!sea) { noSea.push(p.id); return; }
  const wet = MapAnchors.isWater(svg, sea.x, sea.y);
  if (!wet) badSea.push(p.id);
  mk('circle', { cx: sea.x, cy: sea.y, r: s * 0.5, fill: wet ? '#0b4fd6' : '#e2001a',
                 stroke: '#fff', 'stroke-width': s * 0.12 });
  mk('circle', { cx: sea.x, cy: sea.y, r: sea.r, fill: 'none', stroke: wet ? '#0b4fd6' : '#e2001a',
                 'stroke-width': s * 0.1, opacity: .5 });
  mk('line', { x1: a.x, y1: a.y, x2: sea.x, y2: sea.y, stroke: wet ? '#0b4fd6' : '#e2001a',
               'stroke-width': s * 0.07, opacity: .35 });
});
const ms = Math.round(performance.now() - t0);
document.getElementById('hud').textContent =
  `province ${paths.length} · costiere ${coastal} · ${ms} ms\n` +
  `ancora di TERRA fuori dalla provincia: ${badLand.length}  ${badLand.slice(0, 12).join(' ')}\n` +
  `ancora di MARE su terra: ${badSea.length}  ${badSea.slice(0, 12).join(' ')}\n` +
  `costiere senza approdo: ${noSea.length}  ${noSea.slice(0, 12).join(' ')}`;
</script>
</body>
</html>
