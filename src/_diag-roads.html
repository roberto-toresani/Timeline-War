<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Diagnostica strade — alternative</title>
<style>
  html,body{margin:0;background:#8fb3c9;font:12px/1.4 'Segoe UI',sans-serif;color:#222}
  #hud{position:fixed;top:0;left:0;right:0;background:rgba(20,16,11,.92);color:#f2e6cf;
       padding:6px 10px;z-index:9;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #hud button{font:inherit;padding:4px 10px;border-radius:5px;border:1px solid #6b5a3c;
       background:#2c2418;color:#f2e6cf;cursor:pointer}
  #hud button.on{background:#c9a227;color:#1a1408;border-color:#f0d68a;font-weight:600}
  #hud .sp{margin-left:auto;font-family:monospace;opacity:.85}
  #map{padding-top:36px}
  svg{width:100vw;height:auto;display:block}
  path.state{fill:#e6d3a8;stroke:#a08b62;stroke-width:.15}
</style>
</head>
<body>
<div id="hud">
  <strong>Strade:</strong>
  <button data-s="0">0 · attuale (selciato)</button>
  <button data-s="1">1 · fibbia</button>
  <button data-s="2">2 · sentiero antico</button>
  <button data-s="3">3 · maglia di catena</button>
  <button id="zoomtoggle">zoom: Europa</button>
  <span class="sp" id="info">…</span>
</div>
<div id="map"></div>
<script src="data/embedded_map.js"></script>
<script src="js/map-anchors.js"></script>
<script>
// Pagina di lavoro (NON fa parte del gioco): confronta come si vede una strada
// sulla mappa vera. Stesse coppie di province, quattro disegni diversi.
//   ?vb=x,y,w,h  inquadra una zona     ?style=1  parte da uno stile
const q = new URLSearchParams(location.search);
document.getElementById('map').innerHTML = RAW_SVG_CONTENT;
const svg = document.querySelector('svg');
const NS = 'http://www.w3.org/2000/svg';
const INK = '#14100b';
const PAL = ['#c0392b', '#1f6f8b', '#2e7d32', '#8e44ad', '#d68910'];

// ---------- geometria del confine ----------
// Il tratto di confine condiviso: punti di A che toccano B. Da lì si ricava
// il MEZZO del confine, la sua TANGENTE (direzione in cui corre il confine)
// e la NORMALE (di traverso, da A verso B): è la normale a dire se la strada
// va disegnata in orizzontale o in verticale, non la posizione dei centri.
function sharedBorder(A, B) {
  const pa = MapAnchors.boundaryPoints(A), pb = MapAnchors.boundaryPoints(B);
  if (!pa.length || !pb.length) return null;
  // hash spaziale sui punti di B
  const CELL = 1.2, grid = new Map();
  for (const p of pb) {
    const k = Math.round(p.x / CELL) + ',' + Math.round(p.y / CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(p);
  }
  const thr2 = 1.2 * 1.2, hits = [];
  for (const p of pa) {
    const gx = Math.round(p.x / CELL), gy = Math.round(p.y / CELL);
    let found = false;
    for (let dx = -1; dx <= 1 && !found; dx++) for (let dy = -1; dy <= 1 && !found; dy++) {
      const c = grid.get((gx + dx) + ',' + (gy + dy)); if (!c) continue;
      for (const qq of c) {
        const ex = p.x - qq.x, ey = p.y - qq.y;
        if (ex * ex + ey * ey < thr2) { hits.push({ x: (p.x + qq.x) / 2, y: (p.y + qq.y) / 2 }); found = true; break; }
      }
    }
  }
  if (hits.length < 3) return null;
  // centro del tratto condiviso
  let cx = 0, cy = 0;
  for (const h of hits) { cx += h.x; cy += h.y; }
  cx /= hits.length; cy /= hits.length;
  // asse principale (PCA) = tangente del confine
  let sxx = 0, syy = 0, sxy = 0;
  for (const h of hits) { const dx = h.x - cx, dy = h.y - cy; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
  const th = 0.5 * Math.atan2(2 * sxy, sxx - syy);
  let tx = Math.cos(th), ty = Math.sin(th);
  let nx = -ty, ny = tx;                       // normale = perpendicolare
  // lunghezza del confine lungo la tangente (per non fare strade più lunghe del confine)
  let lo = Infinity, hi = -Infinity;
  for (const h of hits) { const t = (h.x - cx) * tx + (h.y - cy) * ty; if (t < lo) lo = t; if (t > hi) hi = t; }
  // il punto del confine più vicino al centro del tratto (il mezzo vero, non la media
  // che su un confine a L cade fuori dal confine)
  let mid = hits[0], best = Infinity;
  for (const h of hits) { const d = (h.x - cx) ** 2 + (h.y - cy) ** 2; if (d < best) { best = d; mid = h; } }
  // orienta la normale da A verso B
  const ba = MapAnchors.mainBodyBBox(A), bb = MapAnchors.mainBodyBBox(B);
  if (ba && bb) {
    const vx = (bb.x + bb.w / 2) - (ba.x + ba.w / 2), vy = (bb.y + bb.h / 2) - (ba.y + ba.h / 2);
    if (nx * vx + ny * vy < 0) { nx = -nx; ny = -ny; }
  }
  const ref = Math.min(ba ? Math.min(ba.w, ba.h) : 12, bb ? Math.min(bb.w, bb.h) : 12);
  return { x: mid.x, y: mid.y, nx, ny, tx, ty, span: hi - lo, ref };
}

// ---------- utilità di disegno ----------
function mk(parent, name, attrs) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e); return e;
}

// ---------- i quattro disegni ----------
// Ognuno riceve un <g> già traslato sul confine e RUOTATO lungo la normale:
// dentro, x = di traverso al confine (da A verso B), y = lungo il confine.
const STYLES = {
  // 0 — quello di adesso: selciato di ciottoli
  0: (g, s, color) => {
    const W = Math.max(3, Math.min(s.ref * 0.13, 5));
    const L = 2 * Math.max(3.5, Math.min(s.ref * 0.3, 7));
    const e = W * 0.12;
    mk(g, 'rect', { x: -L / 2 - e, y: -W / 2, width: L + 2 * e, height: W, rx: W * .5, fill: INK });
    const rows = W >= 4 ? 3 : 2, rowH = W / rows, stoneH = rowH * .82;
    const pitch = rowH * 1.12, stoneL = pitch * .82;
    for (let r = 0; r < rows; r++) {
      const cy = -W / 2 + rowH * (r + .5), off = (r % 2) * (pitch / 2);
      for (let x = -L / 2 + pitch * .55 + off; x <= L / 2 - pitch * .15; x += pitch)
        mk(g, 'rect', { x: x - stoneL / 2, y: cy - stoneH / 2, width: stoneL, height: stoneH,
                        rx: Math.min(stoneL, stoneH) * .38, fill: color, stroke: INK, 'stroke-width': Math.max(.3, W * .07) });
    }
  },

  // 1 — FIBBIA: due borchie (una per provincia) e una barretta che le tiene.
  1: (g, s, color) => {
    const L = Math.max(4.5, Math.min(s.ref * .22, 7));   // lunghezza totale
    const r = L * .17, w = L * .17;
    mk(g, 'line', { x1: -L / 2, y1: 0, x2: L / 2, y2: 0, stroke: INK,
                    'stroke-width': w + L * .1, 'stroke-linecap': 'round' });
    mk(g, 'line', { x1: -L / 2, y1: 0, x2: L / 2, y2: 0, stroke: color,
                    'stroke-width': w, 'stroke-linecap': 'round' });
    [-L / 2, L / 2].forEach(x =>
      mk(g, 'circle', { cx: x, cy: 0, r, fill: color, stroke: INK, 'stroke-width': r * .45 }));
  },

  // 2 — PONTICELLO: una passerella di traverso al confine, con le sue traversine.
  //     È il segno delle carte antiche per un passaggio costruito: dice "qui si
  //     passa" e si legge anche piccolissimo perché ha una forma, non una texture.
  2: (g, s, color) => {
    const L = Math.max(5, Math.min(s.ref * .24, 7.5));
    const w = Math.max(.5, L * .11);                 // spessore dei correnti
    const H = L * .30;                               // semi-larghezza (le traversine)
    // due correnti paralleli lungo la strada
    [-H, H].forEach(y => {
      mk(g, 'line', { x1: -L / 2, y1: y, x2: L / 2, y2: y, stroke: INK,
                      'stroke-width': w * 2.2, 'stroke-linecap': 'round' });
      mk(g, 'line', { x1: -L / 2, y1: y, x2: L / 2, y2: y, stroke: color,
                      'stroke-width': w, 'stroke-linecap': 'round' });
    });
    // tre traversine
    [-L * .3, 0, L * .3].forEach(x => {
      mk(g, 'line', { x1: x, y1: -H, x2: x, y2: H, stroke: INK, 'stroke-width': w * 2.2 });
      mk(g, 'line', { x1: x, y1: -H, x2: x, y2: H, stroke: color, 'stroke-width': w });
    });
  },

  // 3 — MAGLIA DI CATENA: due anelli agganciati a cavallo del confine.
  //     È letteralmente "un gancio tra due province".
  3: (g, s, color) => {
    const L = Math.max(4.5, Math.min(s.ref * .22, 7));
    const rx = L * .3, ry = L * .21, w = Math.max(.5, L * .11);
    [-rx * .72, rx * .72].forEach((x, i) => {
      mk(g, 'ellipse', { cx: x, cy: 0, rx, ry, fill: 'none', stroke: INK, 'stroke-width': w * 2.1 });
      mk(g, 'ellipse', { cx: x, cy: 0, rx, ry, fill: 'none', stroke: color, 'stroke-width': w });
    });
  },
};

// ---------- coppie di province da disegnare ----------
// Prende le province visibili nell'inquadratura e collega quelle che si toccano:
// vengono fuori confini di ogni orientamento, che è il punto della prova.
const paths = Array.from(svg.querySelectorAll('path.state')).filter(p => p.id);
let layer = mk(svg, 'g', { id: 'diag-roads', 'pointer-events': 'none' });
let PAIRS = [], VB = null;

function inView(bb) {
  return VB && bb && bb.x + bb.w > VB[0] && bb.x < VB[0] + VB[2] &&
         bb.y + bb.h > VB[1] && bb.y < VB[1] + VB[3];
}

function buildPairs() {
  const near = paths.map(p => ({ p, bb: MapAnchors.mainBodyBBox(p) }))
                    .filter(o => o.bb && inView(o.bb));
  const out = [];
  for (let i = 0; i < near.length; i++) for (let j = i + 1; j < near.length; j++) {
    const a = near[i], b = near[j];
    const gap = 1.5;
    if (a.bb.x - gap > b.bb.x + b.bb.w || b.bb.x - gap > a.bb.x + a.bb.w) continue;
    if (a.bb.y - gap > b.bb.y + b.bb.h || b.bb.y - gap > a.bb.y + a.bb.h) continue;
    const s = sharedBorder(a.p, b.p);
    if (s) out.push({ a: a.p.id, b: b.p.id, s });
  }
  // In partita le strade sono poche e sparse: disegnarle TUTTE falsa il giudizio.
  // ?all=1 le mostra comunque (prova di affollamento).
  if (q.get('all')) return out;
  const keep = [], MIND = 9;
  for (const o of out) {
    if (keep.every(k => Math.hypot(k.s.x - o.s.x, k.s.y - o.s.y) > MIND)) keep.push(o);
  }
  return keep;
}

let style = +(q.get('style') || 1);
function draw() {
  layer.innerHTML = '';
  PAIRS.forEach((pr, i) => {
    const g = mk(layer, 'g', {});
    const ang = Math.atan2(pr.s.ny, pr.s.nx) * 180 / Math.PI;
    g.setAttribute('transform', `translate(${pr.s.x.toFixed(2)} ${pr.s.y.toFixed(2)}) rotate(${ang.toFixed(1)})`);
    STYLES[style](g, pr.s, PAL[i % PAL.length]);
  });
  document.querySelectorAll('#hud button[data-s]').forEach(b =>
    b.classList.toggle('on', +b.dataset.s === style));
  document.getElementById('info').textContent =
    `${PAIRS.length} strade · stile ${style} · viewBox ${VB.map(n => Math.round(n)).join(' ')}`;
}

const VIEWS = [
  { name: 'Europa', vb: [520, 60, 190, 130] },
  { name: 'Italia/Balcani', vb: [575, 105, 90, 70] },
  { name: 'mondo', vb: [0, 0, 1200, 575] },
];
let vi = 0;
function setView(i) {
  vi = i % VIEWS.length;
  VB = VIEWS[vi].vb.slice();
  svg.setAttribute('viewBox', VB.join(' '));
  document.getElementById('zoomtoggle').textContent = 'zoom: ' + VIEWS[vi].name;
  PAIRS = buildPairs();
  draw();
}

document.querySelectorAll('#hud button[data-s]').forEach(b =>
  b.addEventListener('click', () => { style = +b.dataset.s; draw(); }));
document.getElementById('zoomtoggle').addEventListener('click', () => setView(vi + 1));
addEventListener('keydown', e => { if ('0123'.includes(e.key)) { style = +e.key; draw(); } });

if (q.get('vb')) { VIEWS.unshift({ name: 'custom', vb: q.get('vb').split(',').map(Number) }); }
setView(0);
</script>
</body>
</html>
