<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Diagnostica highlight — alternative</title>
<style>
  html,body{margin:0;background:#8fb4ca;font:12px/1.4 'Segoe UI',sans-serif;color:#222}
  #hud{position:fixed;top:0;left:0;right:0;background:rgba(20,16,11,.92);color:#f2e6cf;
       padding:6px 10px;z-index:9;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  #hud button{font:inherit;padding:4px 9px;border-radius:5px;border:1px solid #6b5a3c;
       background:#2c2418;color:#f2e6cf;cursor:pointer}
  #hud button.on{background:#c9a227;color:#1a1408;border-color:#f0d68a;font-weight:600}
  #hud .sp{margin-left:auto;font-family:monospace;opacity:.85}
  #hud label{display:flex;gap:5px;align-items:center}
  #map{padding-top:34px}
  /* SOLO l'svg esterno scala a tutta larghezza: la mappa embeddata è un svg
     annidato (wrapper > map), e un `svg{...}` crudo colpirebbe anche l'interno,
     rompendo lo zoom (che si fa sul viewBox dell'interno). */
  #map > svg{width:100vw;height:auto;display:block}
  /* stessa base dell'editor: bordo sottilissimo, avorio di pergamena */
  path.state{stroke:#a08b62;stroke-width:.15}
  /* --- lo stato 0 riproduce l'attuale: tratto grosso e lampeggio --- */
  path.state.cur-attack{stroke:#ff7a45 !important;stroke-width:1.5 !important;
       animation:blink 1.6s ease-in-out infinite}
  path.state.cur-move{stroke:#ffd479 !important;stroke-width:1.5 !important;
       animation:blink 1.6s ease-in-out infinite}
  path.state.cur-attack:hover,path.state.cur-move:hover{stroke-width:2.6 !important;animation:none}
  @keyframes blink{0%,100%{stroke-opacity:1}50%{stroke-opacity:.35}}
  /* dash animato (alternativa D) */
  .hl-dash{animation:march 1s linear infinite}
  @keyframes march{to{stroke-dashoffset:-8}}
  /* pulsazione morbida dell'alone (alternativa B) */
  .hl-glow{animation:glow 1.8s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.5}50%{opacity:.85}}
</style>
</head>
<body>
<div id="hud">
  <strong>Highlight:</strong>
  <button data-s="0">0 · attuale</button>
  <button data-s="1">1 · tratto interno (A)</button>
  <button data-s="2">2 · alone interno (B)</button>
  <button data-s="3">3 · velo sul resto (C)</button>
  <button data-s="4">4 · tratteggio mobile (D)</button>
  <button data-s="5">5 · segno dentro (E)</button>
  <button data-s="6">6 · retino (F)</button>
  <button id="kindtoggle">tipo: attacco</button>
  <button id="zoomtoggle">zoom: Europa</button>
  <label>spessore
    <input id="size" type="range" min="0.3" max="2" step="0.05" value="1" style="width:110px">
    <span id="sizeval" style="font-family:monospace">1.00×</span></label>
  <span class="sp" id="info">…</span>
</div>
<div id="map"></div>
<script src="data/embedded_map.js"></script>
<script src="js/map-anchors.js"></script>
<script>
// PAGINA DI LAVORO (non fa parte del gioco): confronta come si evidenzia sulla
// mappa vera una provincia su cui si può agire (bersaglio d'attacco o meta di
// spostamento). Stesse province marcate, sette trattamenti diversi. Il difetto
// da battere è l'attuale (stato 0): tratto 1,5 su bordi da 0,25 e lampeggio,
// che fra due bersagli confinanti forma una banda spessa che non è di nessuno.
//   ?vb=x,y,w,h  inquadra una zona     ?s=1  parte da un'alternativa
const q = new URLSearchParams(location.search);
document.getElementById('map').innerHTML = RAW_SVG_CONTENT;
const NS = 'http://www.w3.org/2000/svg';
// La mappa è un svg ANNIDATO: #wrapper (esterno) > g#map-group > #map (interno,
// dove vivono le province in coordinate 0..1200×0..575). Lo zoom si fa sul
// viewBox dell'INTERNO; l'esterno resta un passa-through a piena larghezza.
const outer = document.querySelector('#map > svg');
const world = document.querySelector('svg#map') ||
  document.querySelector('path.state').ownerSVGElement;
const WORLD = [0, 0, 1200, 575];
outer.setAttribute('viewBox', WORLD.join(' '));   // esterno: passa-through 1:1

// Colori di fase (gli stessi del gioco): arancio attacco, oro spostamento.
const HUE = {
  attacco: { stroke: '#ff7a45', glow: '#ff7a45', ink: '#7a2f12', glyph: '⚔' },
  sposta:  { stroke: '#e8b530', glow: '#ffd479', ink: '#6b5210', glyph: '➜' },
};

function mk(parent, tag, attrs) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  parent.appendChild(el);
  return el;
}

const paths = Array.from(world.querySelectorAll('path.state')).filter(p => p.id);

// Vicinato vero: due province confinano se abbastanza punti di bordo si toccano.
// È la stessa idea di areLandAdjacent nel gioco, ridotta all'osso — qui serve
// solo a scegliere un bersaglio realistico da evidenziare.
function boundaryNear(A, B) {
  const pa = MapAnchors.boundaryPoints(A), pb = MapAnchors.boundaryPoints(B);
  if (!pa.length || !pb.length) return 0;
  const CELL = 1.2, grid = new Map();
  for (const p of pb) {
    const k = Math.round(p.x / CELL) + ',' + Math.round(p.y / CELL);
    (grid.get(k) || grid.set(k, []).get(k)).push(p);
  }
  let hits = 0;
  for (const p of pa) {
    const gx = Math.round(p.x / CELL), gy = Math.round(p.y / CELL);
    let found = false;
    for (let dx = -1; dx <= 1 && !found; dx++) for (let dy = -1; dy <= 1 && !found; dy++) {
      const c = grid.get((gx + dx) + ',' + (gy + dy)); if (!c) continue;
      for (const qq of c) {
        const ex = p.x - qq.x, ey = p.y - qq.y;
        if (ex * ex + ey * ey < 1.44) { hits++; found = true; break; }
      }
    }
  }
  return hits;
}

// defs per clip e pattern (alternative A/B/F): ci mettiamo i cloni ritagliati.
const defs = mk(world, 'defs', {});
// strato dei marchi, SOPRA le province (come l'alone costiero di map-decor).
let layer = mk(world, 'g', { id: 'diag-hl', 'pointer-events': 'none' });
let veil = null;   // stato 3: velo che scurisce tutto il resto

let origin = null, targets = [], VB = null;
let kind = q.get('kind') === 'sposta' ? 'sposta' : 'attacco';
let style = +(q.get('s') || 1);
let SIZE = +(q.get('size') || 1);

function inView(bb) {
  return VB && bb && bb.x + bb.w > VB[0] && bb.x < VB[0] + VB[2] &&
         bb.y + bb.h > VB[1] && bb.y < VB[1] + VB[3];
}

// Sceglie una provincia centrale nell'inquadratura e i suoi confinanti: è il
// caso peggiore per l'affollamento (bersagli attaccati l'uno all'altro).
function pickScene() {
  const vis = paths.map(p => ({ p, bb: MapAnchors.mainBodyBBox(p) }))
                   .filter(o => o.bb && inView(o.bb));
  if (!vis.length) { origin = null; targets = []; return; }
  const cx = VB[0] + VB[2] / 2, cy = VB[1] + VB[3] / 2;
  vis.sort((a, b) =>
    ((a.bb.x + a.bb.w / 2 - cx) ** 2 + (a.bb.y + a.bb.h / 2 - cy) ** 2) -
    ((b.bb.x + b.bb.w / 2 - cx) ** 2 + (b.bb.y + b.bb.h / 2 - cy) ** 2));
  origin = vis[0].p;
  targets = vis.slice(1)
    .filter(o => boundaryNear(origin, o.p) >= 8)
    .map(o => o.p);
}

// Colora la scena come sulla mappa vera: partenza in oro, bersagli neutri (è il
// tratto a dirli, non il fill), resto avorio.
function paintScene() {
  paths.forEach(p => { p.style.fill = '#e8dcc0'; p.classList.remove('cur-attack', 'cur-move'); });
  if (origin) origin.style.fill = '#c9a24a';
}

const clipIds = new Set();
function clipFor(p) {
  const id = 'hlclip-' + p.id;
  if (!clipIds.has(id)) {
    const cp = mk(defs, 'clipPath', { id });
    mk(cp, 'path', { d: p.getAttribute('d') });
    clipIds.add(id);
  }
  return id;
}

let hatchId = null;
function hatchFor(color) {
  hatchId = 'hlhatch';
  const old = document.getElementById(hatchId);
  if (old) old.remove();
  const pat = mk(defs, 'pattern', {
    id: hatchId, width: 1.6, height: 1.6, patternUnits: 'userSpaceOnUse',
    patternTransform: 'rotate(45)'
  });
  mk(pat, 'rect', { width: 1.6, height: 1.6, fill: color, 'fill-opacity': .12 });
  mk(pat, 'line', { x1: 0, y1: 0, x2: 0, y2: 1.6, stroke: color, 'stroke-width': .35, 'stroke-opacity': .55 });
  return hatchId;
}

// --- i sette trattamenti. Ognuno riceve la provincia e i colori di fase. ---
const STYLES = {
  // 0 · ATTUALE: la classe fa tutto (tratto grosso + lampeggio), via CSS.
  0(p, h) { p.classList.add(kind === 'attacco' ? 'cur-attack' : 'cur-move'); },

  // 1 · TRATTO INTERNO (A): clone ritagliato su sé stesso → si vede solo la
  //     metà interna del tratto. Niente sconfinamento nel vicino, i confini
  //     condivisi non raddoppiano. Spesso quanto SIZE ma "dentro".
  1(p, h) {
    mk(layer, 'path', {
      d: p.getAttribute('d'), fill: 'none', stroke: h.stroke,
      'stroke-width': (1.4 * SIZE).toFixed(2), 'stroke-linejoin': 'round',
      'clip-path': `url(#${clipFor(p)})`
    });
  },

  // 2 · ALONE INTERNO (B): tratto largo e tenue, ritagliato dentro. La
  //     provincia si "accende" verso il bordo invece di prendere un contorno
  //     netto. Sotto, un tratto interno sottile e pieno dà il confine preciso.
  2(p, h) {
    mk(layer, 'path', {
      d: p.getAttribute('d'), fill: 'none', stroke: h.glow, class: 'hl-glow',
      'stroke-width': (5 * SIZE).toFixed(2), 'stroke-opacity': .6,
      'clip-path': `url(#${clipFor(p)})`
    });
    mk(layer, 'path', {
      d: p.getAttribute('d'), fill: 'none', stroke: h.stroke,
      'stroke-width': (1 * SIZE).toFixed(2), 'stroke-linejoin': 'round',
      'clip-path': `url(#${clipFor(p)})`
    });
  },

  // 4 · TRATTEGGIO MOBILE (D): il segnale è il MOVIMENTO, non lo spessore.
  //     Tratto sottile tratteggiato, ritagliato dentro, che scorre.
  4(p, h) {
    mk(layer, 'path', {
      d: p.getAttribute('d'), fill: 'none', stroke: h.stroke, class: 'hl-dash',
      'stroke-width': (0.9 * SIZE).toFixed(2), 'stroke-dasharray': '2.6 2',
      'stroke-linecap': 'round', 'clip-path': `url(#${clipFor(p)})`
    });
  },

  // 5 · SEGNO DENTRO (E): nessun tocco ai confini. Un glifo nel punto interno
  //     che landAnchor già calcola per pedine e città, dimensionato sul raggio
  //     libero così non pesta nulla.
  5(p, h) {
    const a = MapAnchors.landAnchor(p);
    if (!a) return;
    const s = Math.max(1.6, Math.min(a.r * 0.9, 4)) * SIZE;
    const t = mk(layer, 'text', {
      x: a.x.toFixed(2), y: a.y.toFixed(2), 'text-anchor': 'middle',
      'dominant-baseline': 'central', 'font-size': s.toFixed(2),
      fill: h.stroke, stroke: '#fff', 'stroke-width': (s * 0.04).toFixed(2),
      'paint-order': 'stroke'
    });
    t.textContent = h.glyph;
  },

  // 6 · RETINO (F): velatura a righe diagonali nel colore della fase, ritagliata
  //     dentro — la zona "marcata" come su una carta militare, più un tratto
  //     interno sottile per il bordo.
  6(p, h) {
    mk(layer, 'path', {
      d: p.getAttribute('d'), fill: `url(#${hatchFor(h.glow)})`,
      'clip-path': `url(#${clipFor(p)})`
    });
    mk(layer, 'path', {
      d: p.getAttribute('d'), fill: 'none', stroke: h.stroke,
      'stroke-width': (0.9 * SIZE).toFixed(2), 'clip-path': `url(#${clipFor(p)})`
    });
  },
};

// 3 · VELO SUL RESTO (C): non si accende il bersaglio, si spegne tutto il resto.
//     Un velo scuro sopra la mappa, bucato sui bersagli con una maschera.
function drawVeil(h) {
  const mid = 'hlmask';
  const old = document.getElementById(mid); if (old) old.remove();
  const mask = mk(defs, 'mask', { id: mid });
  mk(mask, 'rect', { x: VB[0], y: VB[1], width: VB[2], height: VB[3], fill: '#fff' });
  [origin, ...targets].forEach(p => mk(mask, 'path', { d: p.getAttribute('d'), fill: '#000' }));
  veil = mk(layer, 'rect', {
    x: VB[0], y: VB[1], width: VB[2], height: VB[3],
    fill: '#0e0a06', 'fill-opacity': .42, mask: `url(#${mid})`
  });
  // un filo di contorno sui bersagli, così il buco non sembra un caso
  targets.forEach(p => mk(layer, 'path', {
    d: p.getAttribute('d'), fill: 'none', stroke: h.stroke,
    'stroke-width': (0.7 * SIZE).toFixed(2), 'clip-path': `url(#${clipFor(p)})`
  }));
}

function draw() {
  layer.innerHTML = '';
  paintScene();
  const h = HUE[kind];
  if (!targets.length) { info(); return; }
  if (style === 3) { drawVeil(h); }
  else targets.forEach(p => STYLES[style](p, h));
  document.querySelectorAll('#hud button[data-s]').forEach(b =>
    b.classList.toggle('on', +b.dataset.s === style));
  info();
}

function info() {
  document.getElementById('info').textContent =
    `${targets.length} bersagli · stile ${style} · ${kind} · viewBox ${VB.map(n => Math.round(n)).join(' ')}`;
}

const VIEWS = [
  { name: 'Europa', vb: [520, 60, 190, 130] },
  { name: 'Italia/Balcani', vb: [575, 105, 90, 70] },
  { name: 'mondo', vb: [0, 0, 1200, 575] },
];
let vi = 0;
function setView(i) {
  vi = i % VIEWS.length;
  VB = VIEWS[vi].vb.slice();
  world.setAttribute('viewBox', VB.join(' '));
  document.getElementById('zoomtoggle').textContent = 'zoom: ' + VIEWS[vi].name;
  pickScene();
  draw();
}

document.querySelectorAll('#hud button[data-s]').forEach(b =>
  b.addEventListener('click', () => { style = +b.dataset.s; draw(); }));
document.getElementById('zoomtoggle').addEventListener('click', () => setView(vi + 1));
document.getElementById('kindtoggle').addEventListener('click', () => {
  kind = kind === 'attacco' ? 'sposta' : 'attacco';
  document.getElementById('kindtoggle').textContent = 'tipo: ' + kind;
  draw();
});
const sizeEl = document.getElementById('size');
sizeEl.value = SIZE;
sizeEl.addEventListener('input', () => {
  SIZE = +sizeEl.value;
  document.getElementById('sizeval').textContent = SIZE.toFixed(2) + '×';
  draw();
});
document.getElementById('sizeval').textContent = SIZE.toFixed(2) + '×';
document.getElementById('kindtoggle').textContent = 'tipo: ' + kind;
addEventListener('keydown', e => { if ('0123456'.includes(e.key)) { style = +e.key; draw(); } });

if (q.get('vb')) VIEWS.unshift({ name: 'custom', vb: q.get('vb').split(',').map(Number) });
setView(0);
</script>
</body>
</html>
